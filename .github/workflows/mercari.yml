name: Mercari Watch

on:
  schedule:
    - cron: "*/10 * * * *"   # 每 10 分钟（GitHub 高峰期常会延迟）
  workflow_dispatch:          # 允许在 Actions 页面手动运行
    inputs:
      test:
        description: "发送一条 Telegram 测试消息（不检查上新）"
        type: boolean
        default: false

permissions:
  contents: write             # 需要把 seen.json 提交回仓库

concurrency:
  group: mercari-watch        # 同一时间只跑一个，避免重复推送
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check Mercari
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mercari_watch.py ${{ inputs.test && '--test' || '--once' }}

      - name: Save seen.json
        if: ${{ !inputs.test }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "update seen items"
          git pull --rebase --quiet && git push
